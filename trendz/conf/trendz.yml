tb.api:
  # url: "${TB_API_URL:http://localhost:8080}"
  url: "${TB_API_URL:https://app.coreiot.io}"
  custom-dns:
    enabled: "${TB_API_CUSTOM_DNS_ENABLE:false}"
    dns-address: "${TB_API_CUSTOM_DNS_ADDRESS:8.8.8.8}"
  limits:
    pagesize:
      items: "${TB_API_LIMITS_PAGESIZE_ITEMS:100000}"
      telemetry: "${TB_API_LIMITS_PAGESIZE_TELEMETRY:1000000}"
    send:
      items: "${TB_API_LIMITS_SEND_ITEMS:10}"
  retry:
    maxAttempts: "${TB_API_RETRY_MAX_ATTEMPTS:3}"
    timeout: "${TB_API_RETRY_TIMEOUT:10}"
  version-checker:
    use-default-set: "${TB_API_VERSION_DEFAULT_SET:true}"
    default-version: "${TB_API_VERSION_DEFAULT:V_3_6_1}"
    default-pe: "${TB_API_VERSION_PE_DEFAULT:false}"
    default-cloud: "${TB_API_VERSION_CLOUD_DEFAULT:false}"

    use-manual-set: "${TB_API_VERSION_MANUAL_SET:false}"
    manual-version: "${TB_API_VERSION_MANUAL:V_3_6_1}"
    manual-pe: "${TB_API_VERSION_PE_MANUAL:false}"
    manual-cloud: "${TB_API_VERSION_CLOUD_MANUAL:false}"
  widgetBundle:
    maxExpectedDuplicateCount: "${TB_API_WIDGET_BUNDLE_MAX_EXPECTED_DUPLICATE_COUNT:10}"

ratelimit:
  duration.sec: "${RATELIMIT_DURATION_SEC:1}"
  max_requests_per_duration: "${RATELIMIT_MAX_REQUESTS:5000}"
  max_concurent_requests: "${RATELIMIT_CONCURRENT_REQUESTS:8}"
  sendTelemetryBatchSize: "${RATELIMIT_SEND_TELEMETRY_BATCH_SIZE:10}"
  sendTelemetryIntervalMs: "${RATELIMIT_SEND_TELEMETRY_INTERVAL_MS:100}"
  cloud:
    ##  see https://thingsboard.io/products/paas/subscription/ for more
    seconds: "${CLOUD_RATE_LIMIT_SECONDS:150}"
    minutes: "${CLOUD_RATE_LIMIT_MINUTES:6000}"
    hours: "${CLOUD_RATE_LIMIT_HOURS:140000}"
    useCloudRateLimiting: "${CLOUD_RATE_LIMIT_ENABLED:false}"

webclient:
  logging: "${REST_LOGGING:false}"
  custom_header:
    key: "${REST_HEADER_KEY:custom_header_key}"
    value: "${REST_HEADER_VALUE:custom_header_value}"

management:
  endpoints:
    metrics:
      enabled: true
    web:
      exposure:
        include: "${ACTUATOR_ENDPOINTS_INCLUDE:status, health, info, env, metrics, prometheus}"
        exclude: "${ACTUATOR_ENDPOINTS_EXCLUDE:*}"
  health:
    show-details: always
    redis:
      enabled: "${CACHE_REDIS_HEALTH_ENABLE:false}"
  metrics:
    enable:
      jvm: true
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

spring.mvc.cors:
  mappings:
    # Intercept path
    "[/**]":
      #Comma-separated list of origins to allow. '*' allows all origins. When not set,CORS support is disabled.
      allowed-origins: "*"
      #Comma-separated list of methods to allow. '*' allows all methods.
      allowed-methods: "POST,GET,OPTIONS"
      #Comma-separated list of headers to allow in a request. '*' allows all headers.
      allowed-headers: "*"
      #How long, in seconds, the response from a pre-flight request can be cached by clients.
      max-age: "1800"
      #Set whether credentials are supported. When not set, credentials are not supported.
      allow-credentials: "true"
    "[/api/v1/**]":
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"
      max-age: "1800"
      allow-credentials: "true"

spring:
  main:
    allow-bean-definition-overriding: true
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  data:
    jpa:
      repositories:
        enabled: "true"
    redis:
      repositories:
        enabled: "false"

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        order_inserts: true
        order_updates: true
        generate_statistics: false
        jdbc:
          batch_versioned_data: true
          batch_size: 10000
          lob:
            non_contextual_creation: true
        types:
          print:
            banner: false
    hibernate:
      ddl-auto: "validate"
    database-platform: "${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}"
  datasource:
    driverClassName: "${SPRING_DRIVER_CLASS_NAME:org.postgresql.Driver}"
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:1883/trendz}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:postgres}"
    hikari:
      maximumPoolSize: "${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:5}"

